name: discord webhook test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test payloads
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          WEBHOOK="$DISCORD_WEBHOOK"
          mkdir -p assets
          python3 -c "from PIL import Image; im=Image.new('RGB',(32,32)); im.save('assets/thumb.jpg')" || \
            printf '\xff\xd8\xff\xe0\x00\x10JFIF\x00\x01\x01\x00\x00\x01\x00\x01\x00\x00\xff\xd9' > assets/thumb.jpg
          printf '\xff\xd8\xff\xe0\x00\x10JFIF\x00\x01\x01\x00\x00\x01\x00\x01\x00\x00\xff\xd9' > assets/img.jpg
          test -s assets/thumb.jpg && test -s assets/img.jpg

          echo "===== TEST A: AMP-ENTITY TEMPLATE (bundle strings) ====="
          BODY='{"embeds":[{"title":"Nexora v1.27.5 libs &amp; plugins update","description":"test","color":5763719,"thumbnail":{"url":"attachment://thumb.jpg"},"image":{"url":"attachment://img.jpg"},"fields":[{"name":"Status","value":":white_check_mark: Libs &amp; plugins updated","inline":true},{"name":"Version","value":"v1.27.5","inline":true},{"name":"Type","value":"Bundle only (no APK)","inline":true}]}]}'
          curl -sS -w "\nHTTP=%{http_code}\n" -F "payload_json=$BODY" -F "thumb=@assets/thumb.jpg" -F "img=@assets/img.jpg" "$WEBHOOK" || true

          echo "===== TEST B: RAW AMP (no entity) ====="
          BODY='{"embeds":[{"title":"Nexora v1.27.5 libs & plugins update","description":"test","color":5763719,"thumbnail":{"url":"attachment://thumb.jpg"},"image":{"url":"attachment://img.jpg"},"fields":[{"name":"Status","value":":white_check_mark: Libs & plugins updated","inline":true},{"name":"Version","value":"v1.27.5","inline":true},{"name":"Type","value":"Bundle only (no APK)","inline":true}]}]}'
          curl -sS -w "\nHTTP=%{http_code}\n" -F "payload_json=$BODY" -F "thumb=@assets/thumb.jpg" -F "img=@assets/img.jpg" "$WEBHOOK" || true

          echo "===== TEST C: APK-style strings (control) ====="
          BODY='{"embeds":[{"title":"Nexora v1.27.4 released","description":"test","color":5763719,"thumbnail":{"url":"attachment://thumb.jpg"},"image":{"url":"attachment://img.jpg"},"fields":[{"name":"Status","value":":white_check_mark: App update ready","inline":true},{"name":"Version","value":"v1.27.4","inline":true},{"name":"Type","value":"App + libs","inline":true}]}]}'
          curl -sS -w "\nHTTP=%{http_code}\n" -F "payload_json=$BODY" -F "thumb=@assets/thumb.jpg" -F "img=@assets/img.jpg" "$WEBHOOK" || true